services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: childshield
      POSTGRES_PASSWORD: childshield
      POSTGRES_DB: childshield
    ports:
      # Host 5433 — 5432 is commonly taken by other local Postgres instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U childshield"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://childshield:childshield@postgres:5432/childshield?schema=public
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml:8000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://childshield:childshield@postgres:5432/childshield?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ml:
    build:
      context: apps/ml
    environment:
      ML_SERVICE_API_KEY: dev-internal-key
    # Internal network only — no host port mapping in line with the
    # "internal network only" rule; uncomment for direct debugging.
    # ports:
    #   - "8000:8000"

volumes:
  pgdata:

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: childshield
          POSTGRES_PASSWORD: childshield
          POSTGRES_DB: childshield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U childshield"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://childshield:childshield@localhost:5432/childshield_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma validate
        run: pnpm --filter @childshield/db validate

      - name: Generate Prisma client
        run: pnpm --filter @childshield/db generate

      - name: Push schema to test database
        run: pnpm --filter @childshield/db exec prisma db push --skip-generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (includes test/safeguarding — must never be skipped)
        run: pnpm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build api image
        run: docker build -f apps/api/Dockerfile .
      - name: Build worker image
        run: docker build -f apps/worker/Dockerfile .
      - name: Build ml image
        run: docker build apps/ml
